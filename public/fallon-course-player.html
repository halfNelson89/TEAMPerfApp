<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEAM Institute Courses</title>
<meta name="description" content="Interactive courses for sports parents and coaches from TEAM Institute.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap">
<style>
@import url("https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap");
:root{--bg:#F4F2EB;--band:#F4F2EB;--ink:#171B19;--sub:#686F6B;--line:#D8D7D0;--card:#FFFFFF;--sage:#EEF4D4;--peach:#EFE7FF;--orange:#D9FF54;--track:#E7E5DD}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans','Trebuchet MS',sans-serif;font-size:17px;line-height:1.5}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2{font-family:'Newsreader',Georgia,serif;font-weight:400;margin:0}
h1{font-size:clamp(30px,5.5vw,48px);line-height:1.08}
h2{font-size:clamp(22px,4vw,28px);line-height:1.2}
.wrap{max-width:1120px;margin:0 auto}
header{background:var(--band);border-bottom:1px solid var(--line);padding:14px clamp(16px,4vw,40px)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.brand{font-family:'Newsreader',Georgia,serif;font-size:24px;line-height:1.1}
.small{font-size:14px;color:var(--sub)}
.toggle{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.toggle button{min-height:44px;padding:0 20px;border:0;border-radius:999px;font-weight:700;background:transparent}
.toggle button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
main{padding:clamp(20px,4vw,44px) clamp(16px,4vw,40px)}
body.embedded main{padding:0}
.col{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap}
.btn{min-height:52px;padding:0 28px;border-radius:999px;font-weight:700;border:2px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.line{background:transparent;color:var(--ink)}
.link{min-height:44px;padding:0 14px 0 8px;background:transparent;border:0;font-weight:700;display:flex;align-items:center;gap:6px;align-self:flex-start}
.bar{height:10px;border-radius:99px;background:var(--track)}
.bar>div{height:100%;border-radius:99px;background:var(--ink);transition:width .4s,background .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:32px;padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:16px}
.chip{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--sage);border-radius:999px;padding:3px 10px}
.stop{display:flex;gap:14px}
.stop.odd{margin-left:clamp(0px,4vw,36px)}
.node{flex:0 0 44px;display:flex;flex-direction:column;align-items:center}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:700}
.dot.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot.cur{background:var(--orange);border-color:var(--ink)}
.rail{flex:1;width:3px;min-height:16px;background:var(--line)}
.rail.done{background:var(--ink)}.rail.last{background:transparent}
.stopcard{flex:1;min-width:0;margin-bottom:14px;padding:14px 16px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:24px;display:flex;flex-direction:column;gap:4px}
.stopcard.cur{border-color:var(--ink)}.stopcard.done{background:var(--band)}.stopcard.locked{opacity:.55;cursor:not-allowed}
.stoptitle{font-family:'Newsreader',Georgia,serif;font-size:22px;line-height:1.2}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--bg);border-radius:16px;padding:10px 12px}
.tile b{display:block;font-size:19px}
.steps{display:flex;gap:6px}
.steps>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.steps i{display:block;height:6px;border-radius:99px;background:var(--track)}
.steps .past i{background:var(--ink)}.steps .now i{background:var(--orange)}.steps .now{color:var(--ink);font-weight:700}
.opts{display:grid;gap:10px}
.opt{min-height:56px;padding:12px 16px;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:16px;font-size:17px;font-weight:500}
.opt:hover{border-color:var(--ink)}
.opt.best{background:var(--sage);border-color:var(--ink);font-weight:700}
.opt.picked{background:var(--peach);border-color:var(--ink);font-weight:700}
.note{background:var(--band);border-radius:16px;padding:14px 16px}
.note.good{background:var(--sage)}.note.bad{background:var(--peach)}
.video{aspect-ratio:16/9;background:var(--ink);color:var(--bg);border-radius:14px;display:grid;place-items:center;text-align:center;padding:16px;width:100%}
.bullets{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.bullets li{display:flex;gap:10px;align-items:flex-start}
.bullets li:before{content:"";flex:0 0 8px;height:8px;margin-top:9px;border-radius:50%;background:var(--orange)}
.bullets.dark li:before{background:var(--ink)}
.bubble{max-width:85%;display:flex;flex-direction:column;gap:2px}
.bubble span{font-size:12px;color:var(--sub)}
.bubble div{border-radius:16px;padding:10px 14px;background:var(--band)}
.bubble.me{align-self:flex-end}.bubble.me span{text-align:right}.bubble.me div{background:var(--ink);color:var(--bg)}
.report{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.rating{font-size:13px;font-weight:700;border:1px solid var(--ink);border-radius:999px;padding:3px 12px}
.lab{font-size:13px;color:var(--sub);display:block}
.cert{border:3px double var(--ink);border-radius:14px;padding:clamp(18px,4vw,32px);text-align:center;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
input[type=text]{font:inherit;min-height:48px;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;max-width:360px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header,.noprint{display:none!important}main{padding:0}.card{border:0;padding:0}}
</style>
</head>

(function () {
  var DATA = {"parent":{"title":"The Car Ride Home: a course for sports parents","stops":[{"id":"s0","kind":"baseline","chip":"Check","title":"Where you start","sub":"Three questions. No score shown yet.","min":2,"items":[{"prompt":"The best first words after a loss are about:","options":[{"label":"What went wrong","pts":0},{"label":"The effort, or simply being there","pts":1},{"label":"The referee","pts":0}]},{"prompt":"The 24-hour rule means:","options":[{"label":"Wait a day before raising a concern with the coach","pts":1},{"label":"Practice within 24 hours of a loss","pts":0},{"label":"No screens for 24 hours before a game","pts":0}]},{"prompt":"Shouting instructions from the stands usually:","options":[{"label":"Helps the athlete focus","pts":0},{"label":"Splits the athlete’s attention","pts":1},{"label":"Makes no difference","pts":0}]}],"conf":true,"gameName":"Questions"},{"id":"s1","kind":"lesson","chip":"Lesson","title":"Your job on game day","sub":"The one role only a parent can fill.","min":10,"lesson":true,"points":["Coach coaches, official officiates, parent supports.","What kids say they want from parents at competitions.","This course is education, not therapy."]},{"id":"s2","kind":"rapid","chip":"Lesson and game","title":"The sideline","sub":"Game: Cheer or Coach? 45 seconds.","min":12,"lesson":true,"items":[{"prompt":"“Let’s go, Maya!”","note":"Cheering.","options":[{"label":"Cheering","pts":1},{"label":"Coaching from the stands","pts":0}]},{"prompt":"“Shoot! Shoot it now!”","note":"That is an instruction.","options":[{"label":"Cheering","pts":0},{"label":"Coaching from the stands","pts":1}]},{"prompt":"“Great hustle!”","note":"Cheering.","options":[{"label":"Cheering","pts":1},{"label":"Coaching from the stands","pts":0}]},{"prompt":"“Get your elbow up!”","note":"That is technique. Leave it to the coach.","options":[{"label":"Cheering","pts":0},{"label":"Coaching from the stands","pts":1}]},{"prompt":"“Love watching you play!”","note":"Cheering.","options":[{"label":"Cheering","pts":1},{"label":"Coaching from the stands","pts":0}]},{"prompt":"“Why aren’t you covering her?”","note":"That is coaching, with blame attached.","options":[{"label":"Cheering","pts":0},{"label":"Coaching from the stands","pts":1}]},{"prompt":"“Nice effort, keep going!”","note":"Cheering.","options":[{"label":"Cheering","pts":1},{"label":"Coaching from the stands","pts":0}]},{"prompt":"“Pass it to Jordan!”","note":"That is an instruction.","options":[{"label":"Cheering","pts":0},{"label":"Coaching from the stands","pts":1}]}],"timed":45,"gameName":"Cheer or Coach?","points":["Why instructions from the stands hurt performance.","The body language kids read from the field.","Handling a bad call or another parent."]},{"id":"s3","kind":"say","chip":"Lesson and game","title":"The car ride home","sub":"Game: What would you say?","min":12,"lesson":true,"items":[{"context":"Your daughter lost a close match. She gets in the car and stares out the window.","prompt":"What would you say?","options":[{"label":"“What happened out there? You had her.”","pts":0,"fb":"This opens with the result and asks her to explain a loss she is still feeling."},{"label":"“I love watching you compete. Want to talk, or want music?”","pts":2,"fb":"No evaluation, and she sets the pace."},{"label":"“Don’t worry, the ref was terrible.”","pts":1,"fb":"Kind, but it shifts blame and keeps the ride about the result."}]},{"context":"Your son’s team won. He played poorly, and he is thrilled.","prompt":"What would you say?","options":[{"label":"“Good win, but you got lucky. We need to fix your defense.”","pts":0,"fb":"Feedback in the first five minutes turns a good memory into a review."},{"label":"“You looked like you were having fun out there.”","pts":2,"fb":"It meets him where he is. Feedback can wait a day."},{"label":"“Great job! You’re the best one on the team.”","pts":1,"fb":"Warm, but praise tied to rank raises the pressure next time."}]},{"context":"Your daughter sat the whole second half. She says, “Coach hates me.”","prompt":"What would you say?","options":[{"label":"“I’m calling the coach tonight.”","pts":0,"fb":"It takes the problem out of her hands and breaks the 24-hour rule."},{"label":"“That sounds really frustrating. Tell me more.”","pts":2,"fb":"She feels heard first. The plan comes later."},{"label":"“Well, you have to work harder in practice.”","pts":0,"fb":"It may be true, but right now it reads as taking the coach’s side."}]}],"feedback":true,"gameName":"What would you say?","points":["Why the ride home is the moment kids dread.","Let them lead. Questions that open a kid up.","Feedback waits 24 hours."]},{"id":"s3d","kind":"dialogue","chip":"Dialogue game","title":"The conversation: after the semifinal","sub":"Set a goal. Choose your words. See how Mia responds.","min":5,"dlg":{"who":"Mia","you":"You","scene":"Mia, 13, lost her semifinal after leading by four. She gets in the car, shuts the door hard, and stares out the window.","goals":[{"label":"Mia tells me what is really bothering her.","need":"open"},{"label":"Mia picks one thing she wants to work on.","need":"own"},{"label":"Mia cheers up before we get home.","need":"never","fail":"This goal was out of reach from the start. You cannot set a deadline on a child’s feelings, and every line aimed at cheering her up told her the feeling was not welcome."}],"nodes":{"n1":[{"text":"“I love watching you compete. I’m here whenever you want to talk.”","d":20,"reply":"“…I had her. I was up by four.”","next":"n2a","note":"No evaluation, no question. She sets the pace, so she starts talking.","own":false},{"text":"“You were up by four. What happened?”","d":-20,"reply":"“I don’t know! Can we not?”","next":"n2b","note":"It opens with the result and asks her to explain a loss she is still feeling.","own":false},{"text":"“Hey, it’s just one match. You’ll get her next time.”","d":-10,"reply":"“You don’t get it.”","next":"n2c","note":"Reassurance this early tells her the feeling is too big for you to hear.","own":false}],"n2a":[{"text":"“That sounds really frustrating.”","d":20,"reply":"“It is. I froze. I kept thinking, don’t blow it.”","next":"n3aa","note":"Naming the feeling shows you heard her, and she gives you the real story.","own":false},{"text":"“So why did you stop attacking?”","d":-20,"reply":"“I KNOW, okay? Everyone saw.”","next":"n3ab","note":"She had just started talking and you moved to analysis.","own":false},{"text":"“Well, you still got further than last year.”","d":-10,"reply":"“That’s not the point.”","next":"n3ac","note":"A silver lining skips past what she just told you.","own":false}],"n2b":[{"text":"“You’re right. I’m sorry. No questions. Music?”","d":20,"reply":"(A minute passes.) “…I was up by four, Mom.”","next":"n3ba","note":"A clean repair. You gave control back and she returned on her own.","own":false},{"text":"“Don’t take that tone with me. I’m trying to help.”","d":-20,"reply":"(Her headphones go in.)","next":"n3bb","note":"It makes the conversation about her tone, and she leaves it.","own":false},{"text":"“Okay, but we need to talk about it at some point.”","d":-10,"reply":"“Fine. Later.”","next":"n3bc","note":"You backed off and kept the pressure on in the same sentence.","own":false}],"n2c":[{"text":"“You’re right, I don’t. Help me get it.”","d":20,"reply":"“I choked. In front of everyone.”","next":"n3ca","note":"Admitting you do not understand invites her to explain.","own":false},{"text":"“I played sports too, you know. I know exactly how this feels.”","d":-10,"reply":"“It’s not the same.”","next":"n3cb","note":"It turns the conversation toward you.","own":false},{"text":"“I’m just trying to make you feel better.”","d":-20,"reply":"“Well, stop.”","next":"n3cc","note":"It defends your intention when she needed to be heard.","own":false}],"n3aa":[{"text":"“That thought shows up for a lot of athletes. What would you want to try next time it does?”","d":20,"reply":"“Maybe… just think about the next move, not the score?”","next":"end","note":"You normalized the thought and asked. The next step came from her.","own":true},{"text":"“Thank you for telling me. That took guts.”","d":20,"reply":"“Yeah. …Can we get food?”","next":"end","note":"You honored what she shared and left it there.","own":false},{"text":"“Here’s what you need to do: stop looking at the scoreboard.”","d":-20,"reply":"“You always do this.”","next":"end","note":"She opened up and was handed a fix.","own":false}],"n3ab":[{"text":"“That came out wrong. I’m not judging you. I’m sorry.”","d":20,"reply":"(She exhales.) “…It’s okay.”","next":"end","note":"You withdrew the question and owned it. That is repair.","own":false},{"text":"“I’m only asking because I care about your wrestling.”","d":-10,"reply":"“Then stop asking.”","next":"end","note":"It justifies the question when she needed it withdrawn.","own":false},{"text":"“Everyone saw you fight hard, too.”","d":0,"reply":"(She shrugs.)","next":"end","note":"True, but it argues with her feeling.","own":false}],"n3ac":[{"text":"“You’re right. What is the point, for you?”","d":20,"reply":"“That I had it and I gave it away.”","next":"end","note":"You let her correct you and asked for her view.","own":false},{"text":"“I’m just saying there’s a bright side.”","d":-10,"reply":"“I don’t want a bright side.”","next":"end","note":"It repeats the reassurance she just rejected.","own":false},{"text":"“Okay. I’ll stop talking. I’m here.”","d":10,"reply":"(She nods.) “…Thanks.”","next":"end","note":"You stopped pushing and stayed present.","own":false}],"n3ba":[{"text":"“You were. That must sting.”","d":20,"reply":"“It really does.”","next":"end","note":"You reflected her words back and added nothing.","own":false},{"text":"“And what do you think went wrong?”","d":-20,"reply":"(She turns back to the window.)","next":"end","note":"She came back on her own and got the same question again.","own":false},{"text":"“I know, honey. What do you want to try next time?”","d":10,"reply":"“…I don’t know.”","next":"end","note":"A good question, one turn too early. She had only just come back.","own":true}],"n3bb":[{"text":"“I pushed too hard. I’m proud of you, and I’m not going anywhere.”","d":20,"reply":"(She takes one earbud out.) “…Thanks.”","next":"end","note":"You owned it. Too much ground was lost to recover in one line, but the door is open.","own":false},{"text":"“When you’re ready to act your age, we’ll talk.”","d":-20,"reply":"(Silence.)","next":"end","note":"It answers her withdrawal with a put-down.","own":false},{"text":"(Say nothing. Drive, and let the quiet be.)","d":10,"reply":"(Ten minutes later.) “…Sorry I yelled.”","next":"end","note":"Silence gave her room, and she came back.","own":false}],"n3bc":[{"text":"“Forget later. It’s yours to bring up, or not. I mean it.”","d":20,"reply":"“…Okay.”","next":"end","note":"You handed the timing to her.","own":false},{"text":"“Tonight after dinner, then.”","d":-10,"reply":"“Whatever.”","next":"end","note":"It puts a deadline on a conversation she did not agree to.","own":false},{"text":"“I love you. That’s all.”","d":20,"reply":"(Quietly.) “Love you too.”","next":"end","note":"No agenda. It is the one thing she needed to hear.","own":false}],"n3ca":[{"text":"“That sounds awful. Thank you for telling me.”","d":20,"reply":"“…It was.”","next":"end","note":"You accepted her word for it without correcting it.","own":false},{"text":"“You didn’t choke. You just had a bad third period.”","d":-10,"reply":"“That’s literally choking.”","next":"end","note":"It corrects her word when she needed it heard.","own":false},{"text":"“That’s a rough feeling. When you’re ready, what would help next time?”","d":20,"reply":"“Maybe… breathing before the whistle?”","next":"end","note":"You acknowledged the feeling first, then asked. She named the step.","own":true}],"n3cb":[{"text":"“You’re right, it’s not. This is yours. Tell me about it?”","d":20,"reply":"“I just feel stupid.”","next":"end","note":"You gave the moment back to her.","own":false},{"text":"“When I lost the county final I cried for a week.”","d":-10,"reply":"(She rests her head on the window.)","next":"end","note":"A second story about you.","own":false},{"text":"“Fair. I’ll just listen.”","d":20,"reply":"“…Okay.”","next":"end","note":"You stepped back and stayed.","own":false}],"n3cc":[{"text":"“Okay. I’ll stop. I’m sorry.”","d":20,"reply":"“…Thanks.”","next":"end","note":"You did what she asked.","own":false},{"text":"“Fine. I won’t say another word.”","d":-10,"reply":"(Silence.)","next":"end","note":"The words agree with her. The edge in them does not.","own":false},{"text":"“You don’t have to feel better. You can just feel how you feel.”","d":20,"reply":"(She looks over.) “…Okay.”","next":"end","note":"You gave her permission to feel it.","own":false}]}}},{"id":"s4","kind":"survey","chip":"Practice","title":"Try it this week","sub":"Choose one action, then report back.","min":3,"items":[{"prompt":"Pick one thing to try at the next competition.","short":"Trying","options":[{"label":"Let my athlete speak first on the ride home","pts":0},{"label":"Cheer only, no instructions from the stands","pts":0},{"label":"Wait 24 hours before giving any feedback","pts":0}]},{"prompt":"Did you try it?","short":"Tried it","context":"In the live course, these two questions unlock three days after you choose.","options":[{"label":"Yes","pts":0},{"label":"Not yet","pts":0}]},{"prompt":"How did it go?","short":"How it went","options":[{"label":"Hard, and I slipped","pts":0},{"label":"Hard, but I did it","pts":0},{"label":"It felt natural","pts":0},{"label":"It made a clear difference","pts":0}]}],"gameName":"Practice report"},{"id":"s5","kind":"sort","chip":"Lesson and game","title":"Nerves, burnout, and when to worry","sub":"Game: Normal, Watch, or Act.","min":12,"lesson":true,"items":[{"context":"Butterflies before a big meet.","prompt":"Normal, watch, or act?","options":[{"label":"Normal","pts":1,"fb":"Normal. Nerves before competition are expected and often help."},{"label":"Watch","pts":0,"fb":"Normal. Nerves before competition are expected and often help."},{"label":"Act","pts":0,"fb":"Normal. Nerves before competition are expected and often help."}]},{"context":"Stomachaches every game day for a month.","prompt":"Normal, watch, or act?","options":[{"label":"Normal","pts":0,"fb":"Watch. A pattern that repeats for weeks deserves a conversation."},{"label":"Watch","pts":1,"fb":"Watch. A pattern that repeats for weeks deserves a conversation."},{"label":"Act","pts":0,"fb":"Watch. A pattern that repeats for weeks deserves a conversation."}]},{"context":"Quiet for an hour after a loss.","prompt":"Normal, watch, or act?","options":[{"label":"Normal","pts":1,"fb":"Normal. Most athletes need time before they can talk."},{"label":"Watch","pts":0,"fb":"Normal. Most athletes need time before they can talk."},{"label":"Act","pts":0,"fb":"Normal. Most athletes need time before they can talk."}]},{"context":"Skipping meals to make weight.","prompt":"Normal, watch, or act?","options":[{"label":"Normal","pts":0,"fb":"Act. Talk with the athlete and a parent today, and bring in a professional."},{"label":"Watch","pts":0,"fb":"Act. Talk with the athlete and a parent today, and bring in a professional."},{"label":"Act","pts":1,"fb":"Act. Talk with the athlete and a parent today, and bring in a professional."}]},{"context":"Has not wanted to go to practice for three weeks.","prompt":"Normal, watch, or act?","options":[{"label":"Normal","pts":0,"fb":"Watch. A lasting loss of interest is an early sign of burnout."},{"label":"Watch","pts":1,"fb":"Watch. A lasting loss of interest is an early sign of burnout."},{"label":"Act","pts":0,"fb":"Watch. A lasting loss of interest is an early sign of burnout."}]},{"context":"Says “everyone would be better off without me.”","prompt":"Normal, watch, or act?","options":[{"label":"Normal","pts":0,"fb":"Act now. Stay with them and get help. In a crisis, call or text 9  concern with the coach","pts":1},{"label":"Practice within 24 hours of a loss","pts":0},{"label":"No screens for 24 hours before a game","pts":0}]},{"prompt":"Shouting instructions from the stands usually:","options":[{"label":"Helps the athlete focus","pts":0},{"label":"Splits the athlete’s attention","pts":1},{"label":"Makes no difference","pts":0}]}],"conf":true,"gameName":"Questions"}],"pledgeTitle":"Our family agreement","pledge":"I will cheer and leave the coaching to the coach. I will let my athlete lead the ride home. I will wait 24 hours before raising a concern. If I see warning signs, I will ask for help."},"coach":{"title":"Coaching the Whole Athlete: a course for coaches","stops":[{"id":"s0","kind":"baseline","chip":"Check","title":"Where you start","sub":"Three questions. No score shown yet.","min":2,"items":[{"prompt":"Effective correction targets:","options":[{"label":"The athlete’s character","pts":0},{"label":"One specific behavior","pts":1},{"label":"The scoreboard","pts":0}]},{"prompt":"The 24-hour rule asks parents to:","options":[{"label":"Wait a day before raising a concern","pts":1},{"label":"Attend practice within 24 hours","pts":0},{"label":"Email the athletic director first","pts":0}]},{"prompt":"When you see warning signs, your role is to:","options":[{"label":"Diagnose the problem","pts":0},{"label":"Notice and refer","pts":1},{"label":"Wait and see","pts":0}]}],"conf":true,"gameName":"Questions"},{"id":"s1","kind":"lesson","chip":"Lesson","title":"What athletes carry home","sub":"Why your words outlast the season.","min":10,"lesson":true,"points":["How athletes ages 10 to 18 hear feedback.","What they remember years later.","Your role: notice and refer, never diagnose."]},{"id":"s2","kind":"rapid","chip":"Lesson and game","title":"Feedback that builds confidence","sub":"Game: Behavior or Person? 45 seconds.","min":12,"lesson":true,"items":[{"prompt":"“You rushed that shot.”","note":"Behavior. Specific and fixable.","options":[{"label":"About the behavior","pts":1},{"label":"About the person","pts":0}]},{"prompt":"“You’re lazy.”","note":"That labels the person.","options":[{"label":"About the behavior","pts":0},{"label":"About the person","pts":1}]},{"prompt":"“Keep your head up on the reset.”","note":"Behavior.","options":[{"label":"About the behavior","pts":1},{"label":"About the person","pts":0}]},{"prompt":"“You always choke.”","note":"That labels the person.","options":[{"label":"About the behavior","pts":0},{"label":"About the person","pts":1}]},{"prompt":"“Your stance was too high on that takedown.”","note":"Behavior.","options":[{"label":"About the behavior","pts":1},{"label":"About the person","pts":0}]},{"prompt":"“You’re not a competitor.”","note":"That labels the person.","options":[{"label":"About the behavior","pts":0},{"label":"About the person","pts":1}]},{"prompt":"“You stopped moving your feet in the third.”","note":"Behavior.","options":[{"label":"About the behavior","pts":1},{"label":"About the person","pts":0}]},{"prompt":"“You’re soft.”","note":"That labels the person.","options":[{"label":"About the behavior","pts":0},{"label":"About the person","pts":1}]}],"timed":45,"gameName":"Behavior or Person?","points":["Specific over general.","Correct the behavior, never the person.","Private versus public correction."]},{"id":"s3","kind":"say","chip":"Lesson and game","title":"Pressure, mistakes, and resets","sub":"Game: What would you say?","min":12,"lesson":true,"items":[{"context":"An athlete makes the same mistake a third time and looks straight at you.","prompt":"What would you say?","options":[{"label":"“How many times do I have to tell you?”","pts":0,"fb":"It adds shame and no information."},{"label":"“Reset. Next one: hips first.”","pts":2,"fb":"A reset cue and one specific instruction."},{"label":"“It’s fine, don’t worry about it.”","pts":1,"fb":"Kind, but it gives the athlete nothing to do differently."}]},{"context":"Your team lost by one after a late error by a ninth grader. You are in the post-game huddle.","prompt":"What would you say?","options":[{"label":"“We win and lose as a team. One thing we did well, one thing we work on Monday.”","pts":2,"fb":"It protects the athlete and points everyone forward."},{"label":"“That last play cost us the game.”","pts":0,"fb":"Everyone knows who made the play. This singles the athlete out."},{"label":"Say nothing and send them home.","pts":1,"fb":"It avoids harm, but the athlete leaves alone with the error."}]},{"context":"A parent stops you right after the game to argue about playing time.","prompt":"What would you say?","options":[{"label":"Explain your decision on the spot.","pts":1,"fb":"Honest, but emotions are high and other families are watching."},{"label":"“I want to give this real attention. Let’s talk tomorrow.”","pts":2,"fb":"The 24-hour rule, said with respect."},{"label":"“I don’t discuss playing time.”","pts":0,"fb":"It closes the door and the complaint goes somewhere else."}]}],"feedback":true,"gameName":"What would you say?","points":["Why athletes replay errors.","A 10-second reset routine.","What to say between periods."]},{"id":"s3d","kind":"dialogue","chip":"Dialogue game","title":"The conversation: after the goal","sub":"Set a goal. Choose your words. See how Jordan responds.","min":5,"dlg":{"who":"Jordan","you":"You","scene":"Jordan, 15, is your goalkeeper. He gave up the winning goal in the last minute. After the handshake line he sits alone on the bench with his head down.","goals":[{"label":"Jordan knows I have his back and tells me where his head is.","need":"open"},{"label":"Jordan names what he wants to work on Monday.","need":"own"},{"label":"Jordan understands exactly what he did wrong on the goal.","need":"never","fail":"This goal was out of reach from the start. Minutes after a loss, an athlete cannot use technical correction. Each line aimed at the mistake pushed him further away."}],"nodes":{"n1":[{"text":"(You sit down next to him.) “Tough one. I’m glad you’re our keeper.”","d":20,"reply":"“I lost us the game, Coach.”","next":"n2a","note":"You sat at his level and led with belief, so he told you what he was thinking.","own":false},{"text":"“You came off your line too early. We’ll fix it.”","d":-20,"reply":"“I know. I know I did.”","next":"n2b","note":"It opens with the technical error while he is still in it.","own":false},{"text":"“Shake it off. Head up.”","d":-10,"reply":"(He nods and does not look up.)","next":"n2c","note":"A quick instruction skips past how he is doing.","own":false}],"n2a":[{"text":"“That’s a heavy thing to carry. Tell me what’s going through your head.”","d":20,"reply":"“Everyone’s going to think I’m a joke.”","next":"n3aa","note":"You acknowledged the weight and asked instead of telling.","own":false},{"text":"“Well, the goal was on you, but the defense didn’t help.”","d":-20,"reply":"“So it was on me.”","next":"n3ab","note":"He heard one thing: it was on him.","own":false},{"text":"“Don’t say that. You’re fine.”","d":-10,"reply":"“I’m not fine.”","next":"n3ac","note":"It tells him how to feel when he had just told you.","own":false}],"n2b":[{"text":"“I got ahead of myself. That can wait. How are you doing?”","d":20,"reply":"“…Bad. I let everybody down.”","next":"n3ba","note":"A clean repair. You put him ahead of the play.","own":false},{"text":"“Hey. Look at me when I’m talking to you.”","d":-20,"reply":"(He stands up and walks toward the bus.)","next":"n3bb","note":"You demanded attention he could not give, and he left.","own":false},{"text":"“We’ll watch film Monday.”","d":-10,"reply":"“Okay.”","next":"n3bc","note":"It leaves him alone with the mistake until Monday.","own":false}],"n2c":[{"text":"(You wait a moment.) “Forget head up. How are you doing?”","d":20,"reply":"“Not great. That one’s on me.”","next":"n3ca","note":"You caught your own shortcut and asked the real question.","own":false},{"text":"“Come on. The team needs to see you strong.”","d":-20,"reply":"(He pulls his hood up.)","next":"n3cb","note":"It asks him to perform for others at his lowest point.","own":false},{"text":"“Bus leaves in five.”","d":-10,"reply":"“Yeah.”","next":"n3cc","note":"Logistics in place of contact.","own":false}],"n3aa":[{"text":"“Your teammates want you back there. When you’re ready, what’s one thing you’d want to work on Monday?”","d":20,"reply":"“Coming off my line. I want reps on that.”","next":"end","note":"You answered his fear, then asked. He named the work himself.","own":true},{"text":"“This team has your back, and so do I. Go get on the bus with them.”","d":20,"reply":"(He stands up.) “…Thanks, Coach.”","next":"end","note":"You answered the fear directly and sent him back to his team.","own":false},{"text":"“Good keepers have short memories. Toughen up.”","d":-20,"reply":"(He looks down again.)","next":"end","note":"He opened up and was told to toughen up.","own":false}],"n3ab":[{"text":"“That came out wrong. One play did not decide ninety minutes, and I’m not putting this on you.”","d":20,"reply":"(He looks up.) “…Okay.”","next":"end","note":"You took the blame back off him in plain words.","own":false},{"text":"“I’m just being honest with you.”","d":-10,"reply":"“Yeah. Got it.”","next":"end","note":"It defends your comment when he needed it withdrawn.","own":false},{"text":"“Every keeper lets one in.”","d":0,"reply":"(He shrugs.)","next":"end","note":"True, and it does not undo what he just heard.","own":false}],"n3ac":[{"text":"“You’re right. You’re not, and that makes sense. What’s the worst part?”","d":20,"reply":"“Letting the seniors down. It was their last game.”","next":"end","note":"You accepted his correction and asked for more.","own":false},{"text":"“You will be by Monday.”","d":-10,"reply":"“Sure.”","next":"end","note":"It sets a deadline on how he feels.","own":false},{"text":"“Okay. I’ll sit here with you a minute.”","d":10,"reply":"(He nods.) “…Thanks.”","next":"end","note":"You stopped fixing and stayed.","own":false}],"n3ba":[{"text":"“I hear you. That’s a lot to feel.”","d":20,"reply":"“Yeah.”","next":"end","note":"You reflected it back and added nothing.","own":false},{"text":"“So let’s make sure it doesn’t happen again.”","d":-20,"reply":"(He goes quiet.)","next":"end","note":"He had just reopened and you went back to the mistake.","own":false},{"text":"“You did not let me down. What do you want to work on this week?”","d":10,"reply":"“…I don’t know yet.”","next":"end","note":"A good question, one turn too early. He had only just come back.","own":true}],"n3bb":[{"text":"(You catch up and walk beside him.) “I got that wrong. You matter more to me than that goal.”","d":20,"reply":"(He slows down.) “…Okay.”","next":"end","note":"You owned it. Too much ground was lost to recover in one line, but the door is open.","own":false},{"text":"“Don’t you walk away from me.”","d":-20,"reply":"(He keeps walking.)","next":"end","note":"It turns his hurt into a discipline problem.","own":false},{"text":"(Let him go, and check in with him on the bus.)","d":10,"reply":"(On the bus, he makes room on the seat.)","next":"end","note":"You gave him space and came back.","own":false}],"n3bc":[{"text":"“Scratch that. Film can wait. I should have asked how you’re doing.”","d":20,"reply":"“…I’m pretty wrecked.”","next":"end","note":"A late repair, and he answered honestly.","own":false},{"text":"“Be ready to see it a few times.”","d":-10,"reply":"(He stares at the turf.)","next":"end","note":"It promises him more of the worst moment.","own":false},{"text":"“You’re still my keeper next week.”","d":20,"reply":"(A small nod.)","next":"end","note":"It answers the question he was afraid to ask.","own":false}],"n3ca":[{"text":"“I appreciate you owning it. It was a team loss, and I’m proud of how you played.”","d":20,"reply":"“…Thanks, Coach.”","next":"end","note":"You credited his honesty and shared the weight.","own":false},{"text":"“It was. But you’ll learn from it.”","d":-10,"reply":"(He looks away.)","next":"end","note":"It confirms the blame and moves on.","own":false},{"text":"“That’s a lot to carry. When you’re ready, what would you want reps on?”","d":20,"reply":"“Coming off my line. I got caught in between.”","next":"end","note":"You acknowledged the weight first, then asked. He named the work.","own":true}],"n3cb":[{"text":"“That was the wrong thing to say. You don’t have to be strong for anyone right now.”","d":20,"reply":"(The hood comes down a little.)","next":"end","note":"You took the demand back.","own":false},{"text":"“Hood down. We don’t sulk on this team.”","d":-20,"reply":"(He does not move.)","next":"end","note":"It labels his hurt as sulking.","own":false},{"text":"(Sit down beside him and say nothing.)","d":20,"reply":"(After a while.) “…Sorry, Coach.”","next":"end","note":"Presence without a demand.","own":false}],"n3cc":[{"text":"“Jordan. Before the bus: I’m glad you’re our keeper.”","d":20,"reply":"(He looks up for the first time.)","next":"end","note":"One sentence of belief before the moment passed.","own":false},{"text":"“And grab those water bottles.”","d":-10,"reply":"(He does it without a word.)","next":"end","note":"A chore in place of contact.","own":false},{"text":"“Sit with me on the ride back?”","d":20,"reply":"“…Okay.”","next":"end","note":"An invitation with no agenda.","own":false}]}}},{"id":"s4","kind":"survey","chip":"Practice","title":"Try it this week","sub":"Choose one action, then report back.","min":3,"items":[{"prompt":"Pick one thing to try at practice this week.","short":"Trying","options":[{"label":"Correct the behavior, never the person","pts":0},{"label":"Teach the reset routine at one practice","pts":0},{"label":"Hold the 24-hour rule with a parent","pts":0}]},{"prompt":"Did you try it?","short":"Tried it","context":"In the live course, these two questions unlock three days after you choose.","options":[{"label":"Yes","pts":0},{"label":"Not yet","pts":0}]},{"prompt":"How did it go?","short":"How it went","options":[{"label":"Hard, a     if (!name) { S.err = 'Enter your name for the certificate.'; update(); return; }
    S.name = name; S.err = '';
    if (!S.cert[S.role]) S.cert[S.role] = { date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }), id: 'FP-' + Math.random().toString(36).slice(2, 10).toUpperCase() };
    finish();
  }
  function dgGoal(gi) { S.act.dg = dgNew(Number(gi), S.act.dg.tries); update(); }
  function dgRetry(keep) { S.act.dg = dgNew(keep ? S.act.dg.goal : null, S.act.dg.tries); top(); update(true); }
  function dgPick(oi) {
    var a = S.act, st = cur(), dg = a.dg; if (dg.ended || dg.goal === null) return;
    var opt = st.dlg.nodes[dg.node][oi];
    dg.open = Math.max(0, Math.min(100, dg.open + opt.d)); dg.own = dg.own || opt.own;
    dg.log.push({ me: true, text: opt.text }, { me: false, text: opt.reply });
    dg.picks.push({ node: dg.node, oi: oi }); dg.node = opt.next;
    if (opt.next === 'end') {
      var goal = st.dlg.goals[dg.goal];
      dg.ended = true; dg.tries += 1;
      dg.reached = goal.need !== 'never' && dg.open >= 60 && (goal.need !== 'own' || dg.own);
      var before = R(a.id);
      S.results[K(a.id)] = { pts: dg.reached || (before && before.pts) ? 1 : 0, max: 1, tries: dg.tries, answers: [], goal: goal.label, openness: dg.open, picks: dg.picks };
      if (dg.reached) S.done[K(a.id)] = true;
      emit('stop-complete', { stop: a.id, kind: 'dialogue', result: S.results[K(a.id)] });
    }
    update();
  }

  /* ---------- views ---------- */
  function header() {
    if (CONFIG.embedded) return '';
    return '<header><div class="wrap"><div><div class="brand">TEAM Institute</div><div class="small">' + esc(C().title) + '</div></div>' +
      '<div class="toggle" role="group" aria-label="Choose course">' +
      [['parent', 'Parent'], ['coach', 'Coach']].map(function (r) { return '<button data-a="role" data-v="' + r[0] + '" aria-pressed="' + (S.role === r[0]) + '">' + r[1] + '</button>'; }).join('') +
      '</div></div></header>';
  }
  function frac(r) { return r ? r.pts + ' of ' + r.max : 'Not yet'; }
  function mapView() {
    var stops = C().stops;
    var first = stops.filter(function (x) { return !isDone(x.id); })[0];
    var doneCount = stops.filter(function (x) { return isDone(x.id); }).length;
    var mins = stops.filter(function (x) { return !isDone(x.id); }).reduce(function (m, x) { return m + x.min; }, 0);
    var b = R('s0'), f = R('s7'), fu = R('s9'), pr = R('s4'), dr = R('s3d');
    var games = ['s2', 's3', 's5'].filter(function (id) { return R(id); });
    var tiles = [
      ['Baseline', frac(b)], ['Final check', frac(f)],
      ['Gain', b && f ? (f.pts - b.pts >= 0 ? '+' : '') + (f.pts - b.pts) : 'Not yet'],
      ['Quiz game points', games.length ? games.reduce(function (m, id) { return m + R(id).pts; }, 0) + ' of ' + games.reduce(function (m, id) { return m + R(id).max; }, 0) : 'Not yet'],
      ['Conversation', dr ? (dr.pts ? 'Goal reached' : 'Not reached') + ' · ' + dr.tries + (dr.tries === 1 ? ' try' : ' tries') : 'Not yet'],
      ['Practice report', pr ? 'Reported' : 'Not yet'], ['30-day check', frac(fu)]
    ];
    var cert = S.cert[S.role];
    var list = stops.map(function (st, i) {
      var done = isDone(st.id), current = first && first.id === st.id, unlocked = CONFIG.unlockAll || done || current;
      var status = done ? 'Complete' : current ? 'Up next · ' + st.min + ' min' : unlocked ? st.min + ' min' : 'Locked';
      return '<div class="stop' + (i % 2 ? ' odd' : '') + '"><div class="node"><div class="dot' + (done ? ' done' : current ? ' cur' : '') + '">' + (done ? '✓' : i + 1) + '</div><div class="rail' + (i === stops.length - 1 ? ' last' : done ? ' done' : '') + '"></div></div>' +
        '<button class="stopcard' + (current ? ' cur' : '') + (done ? ' done' : '') + (unlocked ? '' : ' locked') + '" ' + (unlocked ? 'data-a="open" data-v="' + st.id + '"' : 'aria-disabled="true"') + '>' +
        '<span class="row" style="align-items:center;gap:8px"><span class="chip"' + (/baseline|final|followup|survey/.test(st.kind) ? ' style="background:var(--peach)"' : '') + '>' + esc(st.chip) + '</span><span class="small">' + status + '</span></span>' +
        '<span class="stoptitle">' + esc(st.title) + '</span><span class="small" style="font-size:15px">' + esc(st.sub) + '</span></button></div>';
    }).join('');
    return '<div class="col" style="gap:24px"><div class="row" style="align-items:flex-end;justify-content:space-between;gap:16px">' +
      '<div class="col" style="flex:1 1 320px;min-width:0;gap:10px"><h1>Your roadmap</h1><div class="small" style="font-size:17px">' + doneCount + ' of ' + stops.length + ' stops complete. About ' + mins + ' minutes left.</div>' +
      '<div class="bar" style="max-width:520px"><div style="width:' + (doneCount / stops.length * 100) + '%"></div></div></div>' +
      '<button class="btn" data-a="open" data-v="' + (first ? first.id : 's8') + '">' + (doneCount === 0 ? 'Start' : first ? 'Continue' : 'Review') + '</button></div>' +
      '<div class="row" style="gap:clamp(20px,4vw,48px);align-items:flex-start"><div class="col" style="flex:999 1 420px;min-width:0">' + list + '</div>' +
      '<aside class="col" style="flex:1 1 280px;min-width:0;gap:14px"><div class="card" style="border-radius:16px;padding:18px;gap:12px"><div class="stoptitle">Your results</div><div class="tiles">' +
      tiles.map(function (t) { return '<div class="tile"><span class="lab">' + t[0] + '</span><b>' + esc(t[1]) + '</b></div>'; }).join('') +
      '</div><div class="small">Saved on this device only.</div></div>' +
      '<div class="col" style="background:var(--sage);border-radius:16px;padding:18px;gap:8px"><b>What your club sees</b>' +
      [['Name', S.name || 'Not entered'], ['Status', isDone('s8') ? 'Complete' : doneCount ? 'In progress' : 'Not started'], ['Date completed', cert ? cert.date : 'Not yet']].map(function (r) { return '<div class="row" style="justify-content:space-between;gap:12px;font-size:15px"><span>' + r[0] + '</span><b>' + esc(r[1]) + '</b></div>'; }).join('') +
      '<div class="small" style="color:#33463B">Your answers and scores stay private.</div></div></aside></div></div>';
  }

  function optsHtml(st, a) {
    var it = st.items[a.i], fb = a.phase === 'fb';
    var best = Math.max.apply(null, it.options.map(function (o) { return o.pts || 0; }));
    var cols = it.options.length === 2 ? 2 : (st.kind === 'sort' ? 3 : 1);
    var h = '<div class="card"><div class="row" style="justify-content:space-between;align-items:center;gap:12px"><span class="small" style="font-size:15px">' + (a.i + 1) + ' of ' + st.items.length + '</span>' +
      (st.timed ? '<b style="font-size:22px;font-variant-numeric:tabular-nums">0:' + (a.time < 10 ? '0' : '') + a.time + '</b>' : '') + '</div>' +
      (it.context ? '<div class="note">' + esc(it.context) + '</div>' : '') + '<h2>' + esc(it.prompt) + '</h2>' +
      '<div class="opts" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr))">' +
      it.options.map(function (o, oi) {
        var cls = fb ? (((o.pts || 0) === best && best > 0) ? ' best' : a.picked === oi ? ' picked' : '') : '';
        return '<button class="opt' + cls + '" ' + (fb ? 'disabled' : 'data-a="pick" data-v="' + oi + '"') + '>' + esc(o.label) + '</button>';
      }).join('') + '</div><div class="small" aria-live="polite" style="min-height:24px;font-size:17px">' + (fb ? '' : esc(a.last || '')) + '</div>';
    if (fb) {
      var po = it.options[a.picked], p = po.pts || 0;
      h += '<div class="note ' + (p === best ? 'good' : 'bad') + '"><b>' + (p === best ? 'Best answer.' : p > 0 ? 'Partly.' : 'Not this one.') + '</b><div>' + esc(po.fb || '') + '</div></div>' +
        '<button class="btn" style="align-self:flex-end" data-a="advance">Next</button>';
    }
    return h + '</div>';
  }
  function doneHtml(st) {
    var r = R(st.id) || { pts: 0, max: 0, answers: [] }, b = R('s0'), f = R('s7');
    var certain = r.answers.filter(function (x) { return x.conf === 2; }), right = certain.filter(function (x) { return x.pts > 0; }).length;
    var cal = certain.length ? 'You were certain on ' + certain.length + ' and right on ' + right + ' of those.' : '';
    var head = 'Lesson complete.', lines = ['Your progress is saved.'], extra = '';
    if (st.kind === 'baseline') { head = 'Baseline recorded.'; lines = ['You will see these questions again at the end and 30 days later.', 'No score is shown now, so the comparison stays fair.']; }
    else if (st.kind === 'final') { head = r.pts + ' of ' + r.max + ' correct.'; lines = [b ? 'Baseline ' + b.pts + ' of ' + b.max + '. Final ' + r.pts + ' of ' + r.max + '.' : 'Take the baseline to see your gain.', cal]; }
    else if (st.kind === 'followup') { head = r.pts + ' of ' + r.max + ' correct, 30 days on.'; lines = [f ? 'Final check ' + f.pts + ' of ' + f.max + '. Today ' + r.pts + ' of ' + r.max + '.' : '', cal]; }
    else if (st.kind === 'say') { head = r.pts + ' of ' + r.max + ' points.'; lines = [r.pts === r.max ? 'Every line you chose put the athlete first.' : 'The strongest lines listen first and save feedback for later.']; }
    else if (st.kind === 'rapid') { head = r.pts + ' of ' + r.max + ' correct.'; lines = [r.answers.length < st.items.length ? 'You answered ' + r.answers.length + ' of ' + st.items.length + ' before time ran out.' : 'You beat the clock.']; }
    else if (st.kind === 'sort') { head = r.pts + ' of ' + r.max + ' correct.'; lines = ['When in doubt between Watch and Act, treat it as Act and ask for help.']; }
    else if (st.kind === 'survey') { head = 'Saved.'; lines = st.items.map(function (it, i) { var an = r.answers.filter(function (x) { return x.i === i; })[0]; return it.short + ': ' + (an ? it.options[an.o].label : ''); }); }
    else if (st.kind === 'cert') {
      var c = S.cert[S.role] || {}; head = 'Course complete.'; lines = ['Your club will see your name, status, and completion date.'];
      extra = '<div class="cert"><div style="font-size:13px;letter-spacing:.14em;text-transform:uppercase">Certificate of completion</div><div class="brand" style="font-size:32px">' + esc(S.name) + '</div><div>' + esc(C().title) + '</div><div class="small" style="font-size:15px">Completed ' + esc(c.date) + ' · Certificate ID ' + esc(c.id) + '</div><div class="small" style="font-size:15px">TEAM Institute · Dr. Corrine Fallon, Psy.D., NCSP</div></div>' +
        '<button class="btn line noprint" style="align-self:flex-start" data-a="print">Print certificate</button>';
    }
    var stops = C().stops, idx = stops.indexOf(st), nx = stops[idx + 1];
    return '<div class="card"><h2 style="font-size:clamp(28px,5vw,38px);line-height:1.1">' + esc(head) + '</h2><div class="col" style="gap:6px">' + lines.filter(Boolean).map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('') + '</div>' + extra +
      '<div class="row noprint" style="gap:10px">' + (nx ? '<button class="btn" data-a="open" data-v="' + nx.id + '">Next stop: ' + esc(nx.title) + '</button>' : '<button class="btn" data-a="map">Back to roadmap</button>') +
      '<button class="btn ghost" data-a="open" data-v="' + st.id + '">Do it again</button></div></div>';
  }
  function dlgHtml(st) {
    var D = st.dlg, d = S.act.dg, goal = d.goal === null ? null : D.goals[d.goal];
    var h = '<div class="note" style="border-radius:20px;padding:clamp(16px,3vw,24px)"><span class="lab" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px">The situation</span><div style="font-size:18px">' + esc(D.scene) + '</div></div>';
    if (d.goal === null) {
      return h + '<div class="card"><h2>What is your goal for this conversation?</h2><div class="small" style="font-size:17px">Pick one. You will be judged against it at the end.</div><div class="opts">' +
        D.goals.map(function (g, gi) { return '<button class="opt" data-a="dgGoal" data-v="' + gi + '">' + esc(g.label) + '</button>'; }).join('') + '</div></div>';
    }
    var word = d.open >= 80 ? 'Talking freely' : d.open >= 60 ? 'Opening up' : d.open >= 40 ? 'Guarded' : 'Shut down';
    h += '<div class="card"><div><span class="lab">Your goal</span><b>' + esc(goal.label) + '</b></div>' +
      '<div class="col" style="gap:6px"><div class="row small" style="justify-content:space-between"><span>How open ' + esc(D.who) + ' is</span><span>' + word + '</span></div><div class="bar" style="height:12px"><div style="width:' + d.open + '%;background:' + (d.open >= 60 ? 'var(--ink)' : 'var(--orange)') + '"></div></div></div>' +
      '<div class="col" style="gap:10px" aria-live="polite"><div class="bubble"><span>' + esc(D.who) + '</span><div>(' + esc(D.who) + ' says nothing.)</div></div>' +
      d.log.map(function (m) { return '<div class="bubble' + (m.me ? ' me' : '') + '"><span>' + (m.me ? 'You' : esc(D.who)) + '</span><div>' + esc(m.text) + '</div></div>'; }).join('') + '</div>';
    if (!d.ended) {
      h += '<div class="col" style="gap:10px;padding-top:12px;border-top:1px solid var(--line)"><b>Turn ' + (d.picks.length + 1) + ' of 3. What do you say?</b>' +
        D.nodes[d.node].map(function (op, oi) { return '<button class="opt" data-a="dgPick" data-v="' + oi + '">' + esc(op.text) + '</button>'; }).join('') + '</div>';
    }
    h += '</div>';
    if (d.ended) {
      var picks = d.picks.map(function (p) { return D.nodes[p.node][p.oi]; });
      var neg = picks.filter(function (p) { return p.d < 0; }), pos = picks.filter(function (p) { return p.d > 0; });
      var lines = [];
      if (d.reached) lines = [D.who + ' finished ' + d.open + '% open. The goal needed 60%.', goal.need === 'own' ? 'You asked, and the next step came from ' + D.who + '.' : pos.length === 3 ? 'All three of your lines listened before they led.' : 'You recovered from a misstep with a repair.'];
      else {
        if (goal.need === 'never') lines.push(goal.fail);
        if (goal.need !== 'never' && d.open < 60) lines.push(D.who + ' finished ' + d.open + '% open. The goal needed 60%.');
        if (goal.need === 'own' && d.open >= 60 && !d.own) lines.push(D.who + ' opened up, but you never asked what ' + D.who + ' would want to try. The next step has to come from the athlete.');
        if (goal.need !== 'never' && neg.length === 1 && d.open < 60) lines.push('One misstep is recoverable only if the next line repairs it.');
      }
      var stops = C().stops, nx = stops[stops.indexOf(st) + 1];
      h += '<div class="card" style="background:' + (d.reached ? 'var(--sage)' : 'var(--peach)') + ';border:2px solid var(--ink);gap:14px"><span class="lab" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--ink)">Conversation coaching report</span>' +
        '<h2 style="font-size:clamp(28px,5vw,38px);line-height:1.1">' + (d.reached ? 'Goal reached.' : 'Goal not reached.') + '</h2><b>Summary</b><ul class="bullets dark">' + lines.map(function (l) { return '<li><span>' + esc(l) + '</span></li>'; }).join('') + '</ul><b>Your lines, turn by turn</b>' +
        d.picks.map(function (pk, i) {
          var p = D.nodes[pk.node][pk.oi];
          var best = D.nodes[pk.node].reduce(function (m, x) { return x.d > m.d ? x : m; });
          var rating = p.d >= 20 ? 'Strong' : p.d > 0 ? 'Partly' : p.d > -20 ? 'Weak' : 'Missed';
          return '<div class="report"><div class="row" style="justify-content:space-between;align-items:center;gap:12px"><b>Turn ' + (i + 1) + '</b><span class="rating" style="background:' + (p.d >= 20 ? 'var(--sage)' : p.d > 0 ? 'var(--band)' : 'var(--peach)') + '">' + rating + '</span></div>' +
            '<div><span class="lab">You said</span>' + esc(p.text) + '</div><div><span class="lab">' + esc(D.who) + ' responded</span>' + esc(p.reply) + '</div><div><span class="lab">Why it landed that way</span>' + esc(p.note) + '</div>' +
            (p.d < 20 ? '<div class="tile"><span class="lab">A stronger line at that moment</span>' + esc(best.text) + ' ' + esc(best.note) + '</div>' : '') + '</div>';
        }).join('') +
        '<div class="row" style="gap:10px">' + (d.reached ? (nx ? '<button class="btn" data-a="open" data-v="' + nx.id + '">Next stop: ' + esc(nx.title) + '</button>' : '<button class="btn" data-a="map">Back to roadmap</button>') : '') +
        '<button class="btn' + (d.reached ? ' line' : '') + '" data-a="dgRetry" data-v="1">' + (d.reached ? 'Play again' : 'Try again') + '</button><button class="btn ghost" data-a="dgRetry" data-v="">Choose a different goal</button></div></div>';
    }
    return '<div class="col" style="gap:16px">' + h + '</div>';
  }
  function stopView() {
    var a = S.act, st = cur(), isDlg = st.kind === 'dialogue';
    var names = isDlg ? ['Goal', 'Conversation', 'Result'] : [].concat(st.lesson ? ['Lesson'] : [], st.items ? [st.gameName] : [], st.kind === 'cert' ? ['Commitment'] : [], ['Result']);
    var at = isDlg ? (a.dg.goal === null ? 0 : a.dg.ended ? 2 : 1) : a.phase === 'lesson' ? 0 : a.phase === 'done' ? names.length - 1 : (st.lesson ? 1 : 0);
    var body = '';
    if (isDlg) body = dlgHtml(st);
    else if (a.phase === 'lesson') {
      body = '<div class="card">' + (st.video ? '<video class="video" controls src="' + esc(st.video) + '"></video>' : '<div class="video">[VIDEO: Dr. Fallon, 8 to 12 minutes]</div>') + '<b>In this lesson</b><ul class="bullets">' +
        (st.points || []).map(function (p) { return '<li><span>' + esc(p) + '</span></li>'; }).join('') + '</ul><button class="btn" style="align-self:flex-start" data-a="begin">' + (st.items ? 'Play: ' + esc(st.gameName) : 'Mark lesson complete') + '</button></div>';
    }
    else if (a.phase === 'q' || a.phase === 'fb') body = optsHtml(st, a);
    else if (a.phase === 'conf') body = '<div class="card"><span class="small" style="font-size:15px">' + (a.i + 1) + ' of ' + st.items.length + '</span><h2>How sure are you of that answer?</h2><div class="opts" style="grid-template-columns:repeat(3,minmax(0,1fr))">' + ['Guessing', 'Fairly sure', 'Certain'].map(function (l, c) { return '<button class="opt" style="text-align:center;font-weight:700" data-a="conf" data-v="' + c + '">' + l + '</button>'; }).join('') + '</div></div>';
    else if (a.phase === 'cert') body = '<div class="card"><h2>' + esc(C().pledgeTitle) + '</h2><div class="note">' + esc(C().pledge) + '</div><div class="col" style="gap:6px"><label for="learner-name"><b>Your name, as it should appear on the certificate</b></label><input id="learner-name" type="text" autocomplete="name" value="' + esc(S.name) + '">' + (S.err ? '<div role="alert" style="font-weight:700">' + esc(S.err) + '</div>' : '') + '</div><button class="btn" style="align-self:flex-start" data-a="agree">I commit to this</button></div>';
    else if (a.phase === 'done') body = doneHtml(st);
    return '<div class="col" style="max-width:760px;margin:0 auto;gap:18px"><button class="link noprint" data-a="map"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Roadmap</button>' +
      '<div class="col noprint" style="gap:8px"><span class="chip">' + esc(st.chip) + '</span><h1 style="font-size:clamp(30px,5vw,44px)">' + esc(st.title) + '</h1></div>' +
      '<div class="steps noprint">' + names.map(function (n, i) { return '<div class="' + (i < at ? 'past' : i === at ? 'now' : '') + '"><i></i>' + esc(n) + '</div>'; }).join('') + '</div>' + body +
      '<div class="small noprint">This course is education. It is not therapy and does not diagnose. In a crisis, call or text 988.</div></div>';
  }
  function render() { app.innerHTML = header() + '<main><div class="wrap">' + (S.view === 'stop' && S.act ? stopView() : mapView()) + '</div></main>'; }

  var actions = {
    role: function (v) { stopT(); S.role = v; S.view = 'map'; S.act = null; update(true); },
    open: open, map: toMap, begin: begin, pick: function (v) { pick(Number(v)); }, conf: function (v) { conf(Number(v)); }, advance: advance, agree: agree,
    dgGoal: dgGoal, dgPick: function (v) { dgPick(Number(v)); }, dgRetry: function (v) { dgRetry(!!v); }, print: function () { window.print(); }
  };
  app.addEventListener('click', function (e) { var el = e.target.closest('[data-a]'); if (el && actions[el.dataset.a]) actions[el.dataset.a](el.dataset.v); });
  render();
})();
</script>
</body>
</html>
